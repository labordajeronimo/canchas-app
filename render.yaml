# Blueprint opcional de Render (también se puede configurar todo a mano desde el dashboard).
# Reemplazá <tu-backend> por el nombre real del servicio.
services:
  - type: web
    name: canchas-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  - type: web
    name: canchas-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # El orden importa: primero la API, después el fallback de la SPA
      - type: rewrite
        source: /api/*
        destination: https://<tu-backend>.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
